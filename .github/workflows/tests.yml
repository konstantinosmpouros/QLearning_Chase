name: QCatch tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Run behavioral and integration tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q --junitxml=verification/junit.xml
      - name: Execute complete smoke notebook
        if: matrix.python-version == '3.12'
        env:
          MPLBACKEND: Agg
        run: python tools/run_smoke_notebook.py --output verification/smoke_executed.ipynb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-python-${{ matrix.python-version }}
          path: verification/
